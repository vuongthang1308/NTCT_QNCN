<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ôn thi trắc nghiệm QNCN</title>
<style>
  :root{
    --bg:#0f1418; --card:#171f26; --card2:#1e2830;
    --text:#eef2f5; --sub:#8a99a6; --accent:#4fb0ff; --accent2:#2f7fd0;
    --good:#3ecf8e; --bad:#ff5c6c; --line:#28333c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:5;
    border-bottom:1px solid var(--line);}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  header .row{display:flex;align-items:center;justify-content:space-between;}
  .btn-icon{background:none;border:none;color:var(--sub);font-size:20px;padding:4px 8px;cursor:pointer;}
  main{flex:1;padding:14px 16px 90px;}

  /* HOME */
  .cat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:background .15s;}
  .cat-card:active{background:var(--card2);}
  .cat-card .name{font-size:15px;font-weight:600;}
  .cat-card .meta{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .cat-card .pct{font-size:13px;font-weight:700;color:var(--accent);min-width:44px;text-align:right;}
  .cat-card input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-right:12px;}
  .cat-left{display:flex;align-items:center;flex:1;}

  .section-label{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;
    margin:18px 0 8px 2px;font-weight:600;}

  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .mode-btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    text-align:center;cursor:pointer;}
  .mode-btn .n{font-size:20px;font-weight:700;color:var(--accent);}
  .mode-btn .l{font-size:12.5px;color:var(--sub);margin-top:2px;}

  .primary-btn{display:block;width:100%;background:var(--accent);color:#04121e;border:none;
    border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer;}
  .primary-btn:disabled{opacity:.4;}
  .secondary-btn{display:block;width:100%;background:var(--card);color:var(--text);
    border:1px solid var(--line);border-radius:14px;padding:13px;font-size:14.5px;font-weight:600;
    margin-top:10px;cursor:pointer;}

  /* QUIZ */
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .progress-bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .25s;}
  .progress-text{font-size:12.5px;color:var(--sub);white-space:nowrap;}

  .q-cat{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .q-text{font-size:16.5px;line-height:1.5;margin:8px 0 18px;font-weight:600;}

  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;
    margin-bottom:10px;font-size:14.5px;line-height:1.45;cursor:pointer;display:flex;gap:10px;}
  .opt .idx{font-weight:700;color:var(--sub);flex-shrink:0;}
  .opt.correct{border-color:var(--good);background:rgba(62,207,142,.12);}
  .opt.wrong{border-color:var(--bad);background:rgba(255,92,108,.12);}
  .opt.disabled{cursor:default;}

  .feedback{font-size:13.5px;color:var(--sub);margin:6px 0 4px;min-height:18px;}
  .feedback.good{color:var(--good);font-weight:600;}
  .feedback.bad{color:var(--bad);font-weight:600;}

  footer.quizfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 16px 18px;
    border-top:1px solid var(--line);}

  /* RESULT */
  .result-score{text-align:center;padding:24px 0 6px;}
  .result-score .big{font-size:44px;font-weight:800;color:var(--accent);}
  .result-score .sub{color:var(--sub);font-size:14px;margin-top:4px;}
  .wrong-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;}
  .wrong-item .qq{font-size:14px;font-weight:600;margin-bottom:8px;}
  .wrong-item .a{font-size:13px;margin-bottom:4px;line-height:1.4;}
  .wrong-item .a.you{color:var(--bad);}
  .wrong-item .a.right{color:var(--good);}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button class="btn-icon" id="backBtn" style="visibility:hidden;">‹ Quay lại</button>
      <h1 id="headerTitle">Ôn thi trắc nghiệm</h1>
      <span style="width:60px"></span>
    </div>
  </header>
  <main id="main"></main>
</div>

uả","Rõ người, rõ việc, rõ thẩm quyền, rõ thời gian, rõ trách nhiệm, rõ kết quả"],"correct":0},{"category":"Chính trị","question":"Đồng chí cho biết Về mục tiêu quốc phòng, bảo vệ Tổ quốc, Đại hội XIV kế thừa, phát triển các nội dung về bảo vệ Tổ quốc từ các kỳ đại hội trước, đồng thời bổ sung mục tiêu?","options":["Bảo đảm cao nhất lợi ích quốc gia - dân tộc” lên trên hết, trước hết; “bảo vệ uy tín, vị thế quốc tế của đất nước”, “bảo vệ an ninh con người”, “an ninh kinh tế, an ninh mạng”; “tăng cường quốc phòng toàn dân, phòng thủ chủ động; ngăn ngừa, đẩy lùi từ sớm các nhân tố gây mất ổn định chính trị từ bên trong”","Tăng cường quốc phòng, bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa là nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước, hệ thống chính trị và toàn dân, trong đó Quân đội nhân dân là nòng cốt, nhưng có bước phát triển mới","Bảo đảm cao nhất lợi ích quốc gia - dân tộc” lên trên hết, trước hết; “bảo vệ uy tín, vị thế quốc tế của đất nước”, “bảo vệ an ninh con người”, “an ninh kinh tế, an ninh mạng”; “tăng cường quốc phòng toàn dân, phòng thủ chủ động; ngăn ngừa, đẩy lùi từ sớm các nhân tố gây mất ổn định chính trị từ bên trong và bên ngoài”"],"correct":0},{"category":"Chính trị","question":"Đồng chí cho biết Về mục tiêu quốc phòng, bảo vệ Tổ quốc, Đại hội XIV xác định?","options":["Ngăn ngừa, đẩy lùi từ sớm các nhân tố gây mất ổn định chính trị từ bên trong và bên ngoài; giữ vững an ninh chính trị, trật tự, an toàn xã hội; giữ vững và củng cố môi trường hòa bình để xây dựng, phát triển đất nước.","Ngăn ngừa, đẩy lùi từ sớm các nhân tố gây mất ổn định chính trị từ bên trong; giữ vững an ninh chính trị, trật tự, an toàn xã hội; giữ vững và củng cố môi trường hòa bình để xây dựng, phát triển đất nước.","Ngăn ngừa, đẩy lùi từ sớm các nhân tố gây mất ổn định chính trị từ bên trong và bên ngoài; giữ vững an ninh chính trị, trật tự, an toàn xã hội; củng cố và giữ vững môi trường hòa bình để xây dựng, phát triển đất nước."],"correct":1},{"category":"C m đau từ 01 tháng trở lên hoặc điều trị một lần tại bệnh viên từ 07 ngày trở lên là bao nhiêu, mỗi năm được hưởng bao nhiêu lần?","options":["Được trợ cấp 500.000đ/1 lần. Mỗi quân nhân được nhận không quá tối đa 02 lần/năm.","Được trợ cấp 1.000.000đ/1 lần. Không giới hạn số lần được nhận.","Được trợ cấp 500.000đ/1 lần. Không giới hạn số lần được nhận."],"correct":0},{"category":"Chính trị","question":"Nghị định 168/2024/NĐ-CP ngày 26/12/2024 của Chính phủ quy định mức phạt tiền của người điều khiển xe ô tô với hành vi không chấp hành hiệu lệnh của đèn tín hiệu giao thông?","options":["6 triệu đến 8 triệu đồng","18 triệu đến 20 triệu đồng","20 triệu đến 22 triệu đồng"],"correct":1},{"category":"Chính trị","question":"Nội dung Điểm a/mục 3/Điều 32/Thông tư số 24/2026/TT-BQP về Điều lệnh quản lý bộ đội Quân đội nhân dân Việt Nam là gì?","options":["Uống rượu, bia trong khi thực hiện nhiệm vụ; ngay trước, trong giờ làm việc và nghỉ giữa giờ làm việc, học tập, công tác; uống say rượu, bia ở mọi lúc, mọi nơi; xúi giục, kích động, lôi kéo, ép buộc người khác uống rượu, bia; điều khiển phương tiện giao thông mà trong máu hoặc hơi thở có nồng độ cồn; mặc quân phục ngồi ở hàng quán vỉa hè hoặc địa điểm không phù hợp với quân nhân.","Hút thuốc lá nơi công cộng hoặc những nơi cấm hút thuốc; đánh bạc, gá bạc, cá độ, tổ chức cho vay nặng lãi. Bán hàng đa cấp; mua, bán, tàng trữ, vận chuyển và sử dụng các chất kích thích, chất hướng thần, chất gây nghiện, tiền chất dưới bất kỳ hình thức nào trái quy định của pháp luật.","Cả hai phương án trên"],"correct":0},{"category":"Chính trị","question":"Nội dung Mục 2/Điều 33/Thông tư số 24/2026/TT-BQP về Điều lệnh quản lý bộ đội Quân đội nhân dân Việt Nam là gì?","options":["Nghe gọi đến tên, quân nhân phải trả lời “Có”. Khi nhận lệnh hoặc trao đổi công việc xong quân nhân phải nói “Rõ”.","Quân nhân gọi nhau bằng “Đồng chí” và xưng “Tôi” sau tiếng “Đồng chí” có thể gọi tiếp cấp bậc, chức vụ, họ tên người mà mình định tiếp xúc. Đối với cấp trên có thể gọi là “Thủ trưởng”.","Trong lúc nghỉ ngơi, quân nhân có thể xưng hô với nhau theo tập quán thông thường"],"correct":0},{"category":"Chính trị","question":"Dấu hiệu nào dễ nhận biết cho thấy người bị say nắng - say nóng đang trong tình trạng nguy hiểm?","options":["Dấu hiệu tổn thương thần kinh trung ương, mất khả năng tự chủ: Rối loạn tâm thần kiểu ảo giác, mê sảng, co giật, giãy giụa, nhiệt độ cơ thể tăng cao trên 40 - 42oC, hôn mê, đồng tử giãn, phản xạ ánh sáng yếu hoặc mất, co giật nhóm cơ, đồng thời rung và cứng cơ, rối loạn hô hấp và tim mạch.","Dấu hiệu của tổn thương đa cơ quan như: Mạch nhanh: 140-160 lần/ phút, đập yếu, huyết áp hạ (huyết áp tối đa thấp hơn 90 mmHg), nhịp thở nhanh, nông.","Cả hai đáp án trên."],"correct":2},{"category":"Chính trị","question":"Thời điểm vàng và nguyên tắc cấp cứu say nắng – say nóng như thế nào?","options":["Do diễn biến của say nắng – say nóng rất nhanh nên thời điểm vàng để cấp cứu chính là thời điểm khi phát hiện triệu chứng hoặc các biểu hiện của say nắng – say nóng (trong khoảng 15-30 phát đầu); lúc đó cần khẩn trương tổ chức sơ cứu ngay tại chỗ, lập tức hạ nhiệt độ lõi của cơ thể xuống dưới 39 độ càng nhanh càng tốt.","Do diễn biến của say nắng – say nóng rất nhanh nên thời điểm vàng để cấp cứu chính là thời điểm khi phát hiện triệu chứng hoặc các biểu hiện của say nắng – say nóng (trong khoảng 15 - 45 phút đầu); lúc đó cần khẩn trương tổ chức sơ cứu ngay tại chỗ, lập tức hạ nhiệt độ lõi của cơ thể xuống nhiệt độ bình thường càng nhanh càng tốt.","Do diễn biến của say nắng – say nóng rất nhanh nên thời điểm vàng để cấp cứu chính là thời điểm khi phát hiện triệu chứng hoặc các biểu hiện của say nắng – say nóng (trong khoảng 15 - 60 phút đầu); lúc đó cần khẩn trương tổ chức sơ cứu ngay tại chỗ, lập tức hạ nhiệt độ lõi của cơ thể xuống dưới 39 độ càng nhanh càng tốt."],"correct":0},{"category":"Chính trị","question":"Nội dung phong trào thi đua “ Ngành Hậu cần quân đội làm theo lời Bác Hồ dạy ’’ là ?","options":["Hoàn thành tốt nhiệm vụ bảo đảm hậu cần thường xuyên cũng như đột xuất trong mọi tình huống, quản lý sử dụng tốt cơ sở vật chất hậu cần, tài chính được giao; xây dựng ngành hậu cần vững mạnh về mọi mặt.","Hoàn thành tốt nhiệm vụ bảo đảm hậu cần SSCĐ, thường xuyên cũng như đột xuất trong mọi tình huống, quản lý sử dụng tốt cơ sở vật chất hậu cần được giao, xây dựng ngành hậu cần chặt chẽ có hệ thống và toàn diện trong các khâu: kiểm tra, giao nhận, vận chuyển, dự trữ, bảo quản, bảo vệ, cấp phát, sử dụng, thanh toán, quyết toán.","Cả 2 phương án trên ."],"correct":0},{"category":"Chính trị","question":"Đồng chí cho biết các mục tiêu Cuộc vận động 50 theo Hướng dẫn số 3500/HD-BCĐ của Ban Chỉ đạo 50 BQP gồm những nội dung nào?","options":["Quản lý tốt VKTBKT; Khai thác VKTBKT tốt, bền; An toàn giao thông.","Quản lý tốt VKTBKT; Khai thác VKTBKT tốt, bền; Bảo đảm an toàn; Thực hành tiết kiệm.","Quản lý tốt VKTBKT; Khai thác VKTBKT tốt, bền; Bảo đảm an toàn."],"correct":1},{"category":"Chính trị","question":"Khái niệm về văn hóa giao thông được hiểu như thế nào là đúng?","options":["Là sự hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông. là ý thức tránh nhiệm với cộng đồng khi tham gia giao thông.","Là ứng xử có văn hóa, có tình yêu thương con người trong các tình huống không may xảy ra khi tham gia giao thông.","Cả hai ý trên."],"correct":2},{"category":"Chính trị","question":"Đồng chí cho biết chủ đề Hưởng ứng Tháng hành động về ATVSLĐ năm 2026 là gì?","options":["Bảo đảm an toàn cho người lao động tại nơi làm việc.","Tăng cường đánh giá, nhận diện nguy cơ, rủi ro và chủ động triển khai các biện pháp bảo đảm an toàn, vệ sinh lao động tại nơi làm việc.","Đổi mới quản lý và nâng cao hiệu quả công tác an toàn, vệ sinh lao động trong kỷ nguyên số."],"correct":2},{"category":"Chính trị","question":"Theo Điều 136, Thông tư 24/2026/TT-BQP, Trách nhiệm của quân nhân trong quản lý sức khỏe được quy định như thế nào?","options":["Quân nhân phải tự bảo vệ sức khỏe của mình, chăm sóc sức khỏe của đồng đội, tích cực luyện tập thể dục, thể thao, chấp hành đúng quy định phòng bệnh, chữa bệnh, giữ vệ sinh cá nhân theo hướng dẫn của ngành quân y.","Quân nhân phải tự bảo vệ sức khỏe của mình, tích cực tham gia rèn luyện, luyện tập thể dục, thể thao, văn hóa văn nghệ, chấp hành đúng quy định phòng bệnh, chữa bệnh, giữ vệ sinh cá nhân theo hướng dẫn của ngành quân y.","Quân nhân phải tự bảo vệ sức khỏe của mình, tích cực tham gia rèn luyện, luyện tập thể dục, thể thao, chấp hành đúng quy định về vệ sinh phòng dịch, chữa bệnh, giữ gìn vệ sinh cá nhân theo hướng dẫn của ngành quân y"],"correct":0},{"category":"Chính trị","question":"Các yếu tố từ môi trường nắng – nóng tác động đến sức khoẻ như thế nào?","options":["Các yếu tố nguy cơ từ môi trường nắng – nóng có tác động không có lợi đến sức khoẻ bao gồm: Nhiệt độ không khí, độ ẩm không khí, vận tốc gió, lượng nhiệt bức xạ từ mặt trời và các nguồn nhiệt khác.","Các yếu tố nguy cơ từ môi trường nắng – nóng có tác động không có lợi đến sức khoẻ bao gồm: Nhiệt độ không khí, độ ẩm không khí, lượng nhiệt bức xạ từ mặt trời và các nguồn nhiệt khác.","Các yếu tố nguy cơ từ môi trường nắng – nóng có tác động đến sức khoẻ bao gồm: Nhiệt độ không khí, độ ẩm không khí, vận tốc gió, lượng nhiệt từ mặt trời và các nguồn nhiệt khác."],"correct":0}];
</script>
<script>
/* ===================== STATE ===================== */
let STATS = {}; // {category: {seen:n, correct:n}}
let selectedCats = new Set();
let session = null; // {items:[], idx:0, correctCount:0, wrongList:[]}

const CATS = [...new Set(QUESTIONS.map(q=>q.category))];

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ===================== STORAGE ===================== */
async function loadStats(){
  try{
    const raw = localStorage.getItem('quiz-stats-qncn');
    STATS = raw ? JSON.parse(raw) : {};
  }catch(e){ STATS = {}; }
}
async function saveStats(){
  try{ localStorage.setItem('quiz-stats-qncn', JSON.stringify(STATS)); }catch(e){}
}
function bumpStat(cat, isCorrect){
  if(!STATS[cat]) STATS[cat]={seen:0,correct:0};
  STATS[cat].seen++;
  if(isCorrect) STATS[cat].correct++;
}

/* ===================== NAV ===================== */
const main = document.getElementById('main');
const headerTitle = document.getElementById('headerTitle');
const backBtn = document.getElementById('backBtn');
backBtn.onclick = ()=>{ renderHome(); };

function setHeader(title, showBack){
  headerTitle.textContent = title;
  backBtn.style.visibility = showBack ? 'visible':'hidden';
}

/* ===================== HOME ===================== */
function renderHome(){
  setHeader('Ôn thi trắc nghiệm', false);
  selectedCats = new Set(CATS); // default: all selected
  main.innerHTML = '';

  const label = document.createElement('div');
  label.className='section-label';
  label.textContent='Chọn chuyên đề';
  main.appendChild(label);

  CATS.forEach(cat=>{
    const total = QUESTIONS.filter(q=>q.category===cat).length;
    const st = STATS[cat];
    const pct = st && st.seen ? Math.round(100*st.correct/st.seen) : null;

    const card = document.createElement('div');
    card.className='cat-card';
    card.innerHTML = `
      <div class="cat-left">
        <input type="checkbox" checked data-cat="${cat}">
        <div>
          <div class="name">${cat}</div>
          <div class="meta">${total} câu${st?` · đã làm ${st.seen}`:''}</div>
        </div>
      </div>
      <div class="pct">${pct!==null?pct+'%':''}</div>
    `;
    const cb = card.querySelector('input');
    cb.onchange = ()=>{
      if(cb.checked) selectedCats.add(cat); else selectedCats.delete(cat);
    };
    card.onclick = (e)=>{ if(e.target.tagName!=='INPUT'){ cb.checked=!cb.checked; cb.onchange(); } };
    main.appendChild(card);
  });

  const modeLabel = document.createElement('div');
  modeLabel.className='section-label';
  modeLabel.textContent='Số câu mỗi lượt';
  main.appendChild(modeLabel);

  const grid = document.createElement('div');
  grid.className='mode-grid';
  [10,20,50,0].forEach(n=>{
    const b = document.createElement('div');
    b.className='mode-btn';
    b.innerHTML = `<div class="n">${n===0?'Tất cả':n}</div><div class="l">câu</div>`;
    b.onclick = ()=>{ [...grid.children].forEach(c=>c.style.borderColor='var(--line)'); b.style.borderColor='var(--accent)'; grid.dataset.chosen=n; };
    grid.appendChild(b);
  });
  grid.dataset.chosen = 20;
  grid.children[1].style.borderColor='var(--accent)';
  main.appendChild(grid);

  const startBtn = document.createElement('button');
  startBtn.className='primary-btn';
  startBtn.textContent='Bắt đầu làm bài';
  startBtn.onclick = ()=> startQuiz(parseInt(grid.dataset.chosen));
  main.appendChild(startBtn);

  const resetBtn = document.createElement('button');
  resetBtn.className='secondary-btn';
  resetBtn.textContent='Xoá tiến độ đã lưu';
  resetBtn.onclick = async ()=>{
    if(confirm('Xoá toàn bộ thống kê đã lưu?')){
      STATS = {}; await saveStats(); renderHome();
    }
  };
  main.appendChild(resetBtn);
}

/* ===================== QUIZ ===================== */
function startQuiz(count){
  let pool = QUESTIONS.filter(q=>selectedCats.has(q.category));
  if(pool.length===0){ alert('Hãy chọn ít nhất 1 chuyên đề.'); return; }
  pool = shuffle(pool);
  if(count>0) pool = pool.slice(0,count);
  session = {items:pool, idx:0, correctCount:0, wrongList:[]};
  renderQuestion();
}

function renderQuestion(){
  setHeader('Câu hỏi', true);
  const {items, idx} = session;
  const q = items[idx];
  const optOrder = q._optOrder || (q._optOrder = shuffle(q.options.map((_,i)=>i)));

  main.innerHTML = '';

  const pw = document.createElement('div'); pw.className='progress-wrap';
  pw.innerHTML = `<div class="progress-bar"><div class="progress-fill" style="width:${100*idx/items.length}%"></div></div>
    <div class="progress-text">${idx+1}/${items.length}</div>`;
  main.appendChild(pw);

  const catEl = document.createElement('div'); catEl.className='q-cat'; catEl.textContent=q.category;
  main.appendChild(catEl);
  const qEl = document.createElement('div'); qEl.className='q-text'; qEl.textContent=q.question;
  main.appendChild(qEl);

  const fb = document.createElement('div'); fb.className='feedback'; fb.id='fb';
  const optsWrap = document.createElement('div');

  let answered = false;
  optOrder.forEach((origIdx, displayI)=>{
    const opt = document.createElement('div');
    opt.className='opt';
    opt.innerHTML = `<span class="idx">${String.fromCharCode(65+displayI)}.</span><span>${q.options[origIdx]}</span>`;
    opt.onclick = ()=>{
      if(answered) return;
      answered = true;
      const isCorrect = origIdx===q.correct;
      [...optsWrap.children].forEach((el,i)=>{
        el.classList.add('disabled');
        if(optOrder[i]===q.correct) el.classList.add('correct');
      });
      if(!isCorrect) opt.classList.add('wrong');
      fb.textContent = isCorrect ? '✓ Chính xác!' : '✗ Chưa đúng — đáp án đúng đã được tô xanh.';
      fb.className = 'feedback ' + (isCorrect?'good':'bad');
      bumpStat(q.category, isCorrect);
      saveStats();
      if(isCorrect) session.correctCount++;
      else session.wrongList.push({q, chosen:origIdx});
      nextBtn.disabled = false;
    };
    optsWrap.appendChild(opt);
  });
  main.appendChild(optsWrap);
  main.appendChild(fb);

  const spacer = document.createElement('div'); spacer.style.height='70px';
  main.appendChild(spacer);

  const foot = document.createElement('footer'); foot.className='quizfoot';
  const nextBtn = document.createElement('button');
  nextBtn.className='primary-btn'; nextBtn.style.marginTop='0';
  nextBtn.textContent = idx+1<items.length ? 'Câu tiếp theo' : 'Xem kết quả';
  nextBtn.disabled = true;
  nextBtn.onclick = ()=>{
    if(idx+1<items.length){ session.idx++; renderQuestion(); }
    else renderResult();
  };
  foot.appendChild(nextBtn);
  main.appendChild(foot);
}

/* ===================== RESULT ===================== */
function renderResult(){
  setHeader('Kết quả', true);
  main.innerHTML = '';
  const {items, correctCount, wrongList} = session;
  const pct = Math.round(100*correctCount/items.length);

  const box = document.createElement('div'); box.className='result-score';
  box.innerHTML = `<div class="big">${correctCount}/${items.length}</div>
    <div class="sub">${pct}% chính xác</div>`;
  main.appendChild(box);

  const retryBtn = document.createElement('button');
  retryBtn.className='primary-btn';
  retryBtn.textContent = wrongList.length ? `Làm lại ${wrongList.length} câu sai` : 'Làm bài mới';
  retryBtn.onclick = ()=>{
    if(wrongList.length){
      session = {items: shuffle(wrongList.map(w=>w.q)), idx:0, correctCount:0, wrongList:[]};
      renderQuestion();
    } else renderHome();
  };
  main.appendChild(retryBtn);

  const homeBtn = document.createElement('button');
  homeBtn.className='secondary-btn';
  homeBtn.textContent='Về trang chủ';
  homeBtn.onclick = renderHome;
  main.appendChild(homeBtn);

  if(wrongList.length){
    const lbl = document.createElement('div'); lbl.className='section-label'; lbl.textContent='Xem lại câu sai';
    main.appendChild(lbl);
    wrongList.forEach(({q,chosen})=>{
      const w = document.createElement('div'); w.className='wrong-item';
      w.innerHTML = `<div class="qq">${q.question}</div>
        <div class="a you">Bạn chọn: ${q.options[chosen]}</div>
        <div class="a right">Đáp án đúng: ${q.options[q.correct]}</div>`;
      main.appendChild(w);
    });
  }
}

/* ===================== INIT ===================== */
(async function init(){
  await loadStats();
  renderHome();
})();
</script>
</body>
</html>
